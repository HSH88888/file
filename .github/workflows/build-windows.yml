name: Windows 실행 파일 빌드

on:
  push:
    paths:
      - "photo_dedup.py"
      - "photo_dedup.html"
      - "installer/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

env:
  APP_VERSION: "1.0.${{ github.run_number }}"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: python -m pip install --upgrade pip pyinstaller Pillow pillow-heif send2trash

      - name: 아이콘 만들기
        run: python installer/make_icon.py installer/app.ico

      - name: 설치용 프로그램 폴더 만들기 (onedir)
        run: >
          pyinstaller --noconfirm --onedir --console
          --name PhotoDedup --icon installer/app.ico
          --add-data "photo_dedup.html;."
          --collect-all pillow_heif
          --hidden-import send2trash
          photo_dedup.py

      - name: 단일 exe 만들기 (설치 없이 쓰는 버전)
        run: >
          pyinstaller --noconfirm --onefile --console
          --name PhotoDedup-Portable --icon installer/app.ico
          --add-data "photo_dedup.html;."
          --collect-all pillow_heif
          --hidden-import send2trash
          --distpath dist-portable
          photo_dedup.py

      - name: 실행 확인 (서버가 뜨고 화면이 응답하는지)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\PhotoDedup\PhotoDedup.exe", "dist-portable\PhotoDedup-Portable.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8799" -PassThru
            Start-Sleep -Seconds 8
            $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/status
            Write-Output "$exe -> $($r.Content)"
            $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/
            if ($h.StatusCode -ne 200) { throw "UI not served by $exe" }
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }

      - name: Inno Setup 준비
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 설치 프로그램 만들기
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\PhotoDedup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: 설치 확인 (조용히 설치 → 실행 → 제거)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PhotoDedup-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\PhotoDedup\PhotoDedup.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/
          if ($r.StatusCode -ne 200) { throw "installed app did not start" }
          Stop-Process -Id $p.Id -Force
          $un = Join-Path $env:LOCALAPPDATA "Programs\PhotoDedup\unins000.exe"
          Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left the app behind" }
          Write-Output "install / run / uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDedup-Setup
          path: dist/PhotoDedup-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDedup-Portable
          path: dist-portable/PhotoDedup-Portable.exe
